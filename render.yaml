services:
  - type: web
    name: jjmm-romantic-museum
    env: node
    plan: free
    region: frankfurt
    rootDir: jjmmmuseum
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

